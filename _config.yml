# Site Settings
title: Open Autonomy Lab
tagline: We build intelligent autonomous robots
email: contact@openautonomylab.org
description: >
  Researching and developing autonomous robots and systems.
baseurl:
url: "https://oalab.org"
permalink: pretty

paginate: 5
paginate_path: "/research/page:num"

plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-scholar
  - kramdown-parser-gfm
  - nokogiri

exclude:
  - Gemfile
  - bulma-clean-theme.gemspec
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - yarn.lock
  - Dockerfile
  - docker-compose.yml
  - README.md
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

livereload: true

sass:
  style: compressed
  source_dir: _sass

# google_analytics: G-XXXXXXXXXX

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      show_sidebar: true
  -
    scope:
      path: ""
      type: "posts"
    values:
      author: "Open Autonomy Lab"
      layout: post
      show_sidebar: true

markdown: kramdown
highlighter: rouge

collections:
  team:
    output: true
    layout: product
    show_sidebar: false

scholar:
  style: simple-ieee.csl
  bibliography_list_tag: "ol"
  bibliography_template: bibtemplate
